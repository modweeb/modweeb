name: تحديث أحدث المقالات من Modweeb

on:
  schedule:
    - cron: '0 */6 * * *' # كل 6 ساعات
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://modweeb.com/feeds/posts/default?alt=rss"
          max_post_count: 5
          readme_path: "./README.md"
